<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Rainbow ASMR Obby</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game" aria-label="3D rainbow obby game"></canvas>
  <div class="hud">
    <div id="levelChip" class="level-chip"><span class="dot"></span><span id="levelName">Pink Prelude</span></div>
    <div class="coin-bar">🪙 <span id="coinCount">0</span></div>
  </div>
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="overlayTitle">Level Complete!</h2>
      <p id="overlayBody">You found every coin.</p>
      <div id="overlayReward" class="overlay-reward" hidden></div>
      <div class="overlay-actions">
        <button id="overlayPlay" type="button">Keep playing</button>
        <button id="overlayNext" type="button">Next level</button>
        <button id="overlayRestart" type="button">Restart level</button>
      </div>
    </div>
  </div>
  <div class="shop-prompt" id="shopPrompt" hidden></div>
  <button id="useButton" class="use-button" hidden aria-label="Use">USE</button>
  <div class="top-buttons">
    <button id="menuButton" aria-label="Open teleport menu">🗺️</button>
    <button id="wardrobeButton" aria-label="Open costume wardrobe">🧺</button>
    <button id="soundButton" aria-label="Toggle sound" aria-pressed="true">🔊</button>
  </div>
  <aside id="menu" class="menu" aria-label="Teleport menu" hidden>
    <div class="menu-title">Teleport</div>
    <div id="menuList" class="menu-list"></div>
    <div class="menu-hint">Unlocked levels, the home area and the shop.</div>
  </aside>
  <aside id="wardrobe" class="wardrobe" aria-label="Costume wardrobe" hidden>
    <div class="wardrobe-title">Choose a costume</div>
    <div class="gender-toggle"><button id="girlMode" type="button">Girl</button><button id="boyMode" type="button">Boy</button></div>
    <div class="wardrobe-columns">
      <section><h2>All costumes</h2><div id="costumeList" class="costume-list"></div></section>
    </div>
  </aside>
  <div id="stick" class="stick" aria-label="Movement joystick"><span></span></div>
  <button id="jump" aria-label="Jump">JUMP</button>
  <script src="three.min.js"></script>
  <script src="cannon.min.js"></script>
  <script src="levels.js"></script>
  <script src="costumes.js"></script>
  <script src="script.js"></script>
</body>
</html>
